<div class="container">
  <h2>{{ isEditMode ? 'Editar' : 'Nueva' }} Ciudad</h2>

  <form [formGroup]="cityForm" (ngSubmit)="save()">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control"
        [class.is-invalid]="cityForm.get('name')?.invalid && cityForm.get('name')?.touched"
      >
      <div class="invalid-feedback" *ngIf="cityForm.get('name')?.invalid && cityForm.get('name')?.touched">
        El nombre es requerido
      </div>
    </div>

    <div class="form-group">
      <label for="stateId">ID del Departamento</label>
      <input
        type="text"
        id="stateId"
        formControlName="stateId"
        class="form-control"
        [class.is-invalid]="cityForm.get('stateId')?.invalid && cityForm.get('stateId')?.touched"
      >
      <div class="invalid-feedback" *ngIf="cityForm.get('stateId')?.invalid && cityForm.get('stateId')?.touched">
        El ID del departamento es requerido
      </div>
    </div>

    <div class="button-group">
      <button type="button" class="btn btn-secondary" [routerLink]="['/cities']">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="cityForm.invalid">
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
