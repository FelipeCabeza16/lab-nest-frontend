<div class="container">
  <div class="header">
    <h2>Materiales</h2>
    <button class="btn btn-primary" [routerLink]="['/materials/new']">
      Nuevo Material
    </button>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Código</th>
        <th>Descripción</th>
        <th>Nombre</th>
        <th>Unidad</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let material of materials">
        <td>{{ material.code }}</td>
        <td>{{ material.description }}</td>
        <td>{{ material.name }}</td>
        <td>{{ material.unit?.name }}</td>
        <td>{{ material.price | currency }}</td>
        <td>
          <div class="actions">
            <button class="btn btn-sm btn-info" [routerLink]="['/materials', material.id]">
              Editar
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteMaterial(material.id)">
              Eliminar
            </button>
          </div>
        </td>
      </tr>
      <tr *ngIf="materials.length === 0">
        <td colspan="5" class="text-center">No hay materiales registrados</td>
      </tr>
    </tbody>
  </table>
</div>
