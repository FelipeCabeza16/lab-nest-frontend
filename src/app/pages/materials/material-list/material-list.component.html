<div class="p-8">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Materiales</h2>
    <button
      [routerLink]="['/materials/new']"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded"
    >
      Nuevo Material
    </button>
  </div>

  <!-- Tabla -->
  <div class="overflow-x-auto bg-white rounded shadow">
    <table class="min-w-full border-collapse">
      <thead class="bg-gray-100 text-gray-700 font-semibold">
        <tr>
          <th class="px-6 py-4 text-left">Código</th>
          <th class="px-6 py-4 text-left">Descripción</th>
          <th class="px-6 py-4 text-left">Nombre</th>
          <th class="px-6 py-4 text-left">Unidad</th>
          <th class="px-6 py-4 text-left">Precio</th>
          <th class="px-6 py-4 text-left">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let material of materials"
          class="hover:bg-gray-50 border-b last:border-b-0"
        >
          <td class="px-6 py-4">{{ material.code }}</td>
          <td class="px-6 py-4">{{ material.description }}</td>
          <td class="px-6 py-4">{{ material.name }}</td>
          <td class="px-6 py-4">{{ material.unit?.name }}</td>
          <td class="px-6 py-4">{{ material.price | currency }}</td>
          <td class="px-6 py-4">
            <div class="flex gap-2">
              <button
                class="bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-1 text-sm rounded"
                [routerLink]="['/materials/edit', material.id]"
              >
                Editar
              </button>
              <button
                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 text-sm rounded"
                (click)="deleteMaterial(material.id)"
              >
                Eliminar
              </button>
            </div>
          </td>
        </tr>

        <tr *ngIf="materials.length === 0">
          <td colspan="6" class="text-center py-6 text-gray-500">
            No hay materiales registrados
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
