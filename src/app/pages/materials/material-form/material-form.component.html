<div class="max-w-lg mx-auto mt-8 p-6 bg-white rounded-lg shadow">
  <h2 class="text-2xl font-semibold text-center text-gray-800 mb-8">
    {{ isEditMode ? 'Editar' : 'Nuevo' }} Material
  </h2>

  <!-- Mensaje de error -->
  <div *ngIf="errorMessage" class="mb-6 px-4 py-3 border border-red-400 text-red-700 bg-red-100 rounded">
    <strong class="font-bold">Error:</strong>
    <span class="block">{{ errorMessage }}</span>
  </div>

  <form [formGroup]="materialForm" (ngSubmit)="save()">
    <!-- Código -->
    <div class="mb-6">
      <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Código</label>
      <input
        type="text"
        id="code"
        formControlName="code"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="materialForm.get('code')?.invalid && materialForm.get('code')?.touched"
      />
      <div class="text-sm text-red-600 mt-1" *ngIf="materialForm.get('code')?.invalid && materialForm.get('code')?.touched">
        El código es requerido
      </div>
    </div>

    <!-- Nombre -->
    <div class="mb-6">
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="materialForm.get('name')?.invalid && materialForm.get('name')?.touched"
      />
      <div class="text-sm text-red-600 mt-1" *ngIf="materialForm.get('name')?.invalid && materialForm.get('name')?.touched">
        El nombre es requerido
      </div>
    </div>

    <!-- Descripción -->
    <div class="mb-6">
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
      <input
        type="text"
        id="description"
        formControlName="description"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="materialForm.get('description')?.invalid && materialForm.get('description')?.touched"
      />
      <div class="text-sm text-red-600 mt-1" *ngIf="materialForm.get('description')?.invalid && materialForm.get('description')?.touched">
        La descripción es requerida
      </div>
    </div>

    <!-- Unidad -->
    <div class="mb-6">
      <label for="unitId" class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
      <select
        id="unitId"
        formControlName="unitId"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="materialForm.get('unitId')?.invalid && materialForm.get('unitId')?.touched"
      >
        <option value="">Seleccione una unidad</option>
        <option *ngFor="let unit of units" [value]="unit.id">{{ unit.name }}</option>
      </select>
      <div class="text-sm text-red-600 mt-1" *ngIf="materialForm.get('unitId')?.invalid && materialForm.get('unitId')?.touched">
        La unidad es requerida
      </div>
    </div>

    <!-- Precio -->
    <div class="mb-6">
      <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Precio</label>
      <input
        type="number"
        id="price"
        formControlName="price"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="materialForm.get('price')?.invalid && materialForm.get('price')?.touched"
      />
      <div class="text-sm text-red-600 mt-1" *ngIf="materialForm.get('price')?.invalid && materialForm.get('price')?.touched">
        <span *ngIf="materialForm.get('price')?.errors?.['required']">El precio es requerido</span>
        <span *ngIf="materialForm.get('price')?.errors?.['min']">El precio debe ser mayor a 0</span>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-4 mt-8">
      <button
        type="button"
        [routerLink]="['/materials']"
        class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md font-medium"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="materialForm.invalid"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
