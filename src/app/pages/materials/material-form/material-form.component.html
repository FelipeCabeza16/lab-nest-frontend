<div class="container">
  <h2>{{ isEditMode ? 'Editar' : 'Nuevo' }} Material</h2>

  <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    <strong class="font-bold">Error: </strong>
    <span class="block sm:inline">{{ errorMessage }}</span>
  </div>
  <form [formGroup]="materialForm" (ngSubmit)="save()">
    <div class="form-group">
      <label for="code">Código</label>
      <input
        type="text"
        id="code"
        formControlName="code"
        class="form-control"
        [class.is-invalid]="materialForm.get('code')?.invalid && materialForm.get('code')?.touched"
      >
      <div class="invalid-feedback" *ngIf="materialForm.get('code')?.invalid && materialForm.get('code')?.touched">
        El código es requerido
      </div>
    </div>

    <div class="form-group">
      <label for="name">Nombre</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control"
        [class.is-invalid]="materialForm.get('name')?.invalid && materialForm.get('name')?.touched"
      >
      <div class="invalid-feedback" *ngIf="materialForm.get('name')?.invalid && materialForm.get('name')?.touched">
        El nombre es requerido
      </div>
    </div>
    <div class="form-group">
      <label for="description">Descripción</label>
      <input
        type="text"
        id="description"
        formControlName="description"
        class="form-control"
        [class.is-invalid]="materialForm.get('description')?.invalid && materialForm.get('description')?.touched"
      >
      <div class="invalid-feedback" *ngIf="materialForm.get('description')?.invalid && materialForm.get('description')?.touched">
        La descripción es requerida
      </div>
    </div>

    <div class="form-group">
      <label for="unitId">Unidad</label>
      <select
        id="unitId"
        formControlName="unitId"
        class="form-control"
        [class.is-invalid]="materialForm.get('unitId')?.invalid && materialForm.get('unitId')?.touched"
      >
        <option value="">Seleccione una unidad</option>
        <option *ngFor="let unit of units" [value]="unit.id">{{ unit.name }}</option>
      </select>
      <div class="invalid-feedback" *ngIf="materialForm.get('unitId')?.invalid && materialForm.get('unitId')?.touched">
        La unidad es requerida
      </div>
    </div>

    <div class="form-group">
      <label for="price">Precio</label>
      <input
        type="number"
        id="price"
        formControlName="price"
        class="form-control"
        [class.is-invalid]="materialForm.get('price')?.invalid && materialForm.get('price')?.touched"
      >
      <div class="invalid-feedback" *ngIf="materialForm.get('price')?.invalid && materialForm.get('price')?.touched">
        <span *ngIf="materialForm.get('price')?.errors?.['required']">El precio es requerido</span>
        <span *ngIf="materialForm.get('price')?.errors?.['min']">El precio debe ser mayor a 0</span>
      </div>
    </div>

    <div class="button-group">
      <button type="button" class="btn btn-secondary" [routerLink]="['/materials']">
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="materialForm.invalid">
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
