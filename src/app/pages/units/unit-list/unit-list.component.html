<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Unidades</h1>
  <a routerLink="/units/new" class="bg-blue-600 text-white px-4 py-2 rounded mb-4 inline-block">+ Crear unidad</a>
  <table class="w-full border">
    <thead>
      <tr class="bg-gray-200 text-left">
        <th class="p-2">Nombre</th>
        <th class="p-2">Símbolo</th>
        <th class="p-2">Descripción</th>
        <th class="p-2">Código</th>
        <th class="p-2">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let unit of units">
        <td class="p-2">{{ unit.name }}</td>
        <td class="p-2">{{ unit.symbol }}</td>
        <td class="p-2">{{ unit.description }}</td>
        <td class="p-2">{{ unit.code }}</td>
        <td class="p-2">
          <button (click)="deleteUnit(unit.id!)" class="text-red-600 ml-4">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
