<div class="container">
  <h2>{{ isEditMode ? 'Editar Unidad' : 'Nueva Unidad' }}</h2>

  <form [formGroup]="unitForm" (ngSubmit)="save()">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-control"
        [class.is-invalid]="unitForm.get('name')?.invalid && unitForm.get('name')?.touched"
      />
      <div class="invalid-feedback" *ngIf="unitForm.get('name')?.invalid && unitForm.get('name')?.touched">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="code">Código</label>
      <input
        type="text"
        id="code"
        formControlName="code"
        class="form-control"
        [class.is-invalid]="unitForm.get('code')?.invalid && unitForm.get('code')?.touched"
      />
      <div class="invalid-feedback" *ngIf="unitForm.get('code')?.invalid && unitForm.get('code')?.touched">
        El código es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="symbol">Símbolo</label>
      <input
        type="text"
        id="symbol"
        formControlName="symbol"
        class="form-control"
        [class.is-invalid]="unitForm.get('symbol')?.invalid && unitForm.get('symbol')?.touched"
      />
      <div class="invalid-feedback" *ngIf="unitForm.get('symbol')?.invalid && unitForm.get('symbol')?.touched">
        El símbolo es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Descripción</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        rows="3"
        [class.is-invalid]="unitForm.get('description')?.invalid && unitForm.get('description')?.touched"
      ></textarea>
      <div class="invalid-feedback" *ngIf="unitForm.get('description')?.invalid && unitForm.get('description')?.touched">
        La descripción es obligatoria.
      </div>
    </div>

    <div class="button-group mt-3">
      <button type="submit" class="btn btn-primary" [disabled]="unitForm.invalid">
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
      <button type="button" class="btn btn-secondary" [routerLink]="['/units']">Cancelar</button>
    </div>
  </form>
</div>
