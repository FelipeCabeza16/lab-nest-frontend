<div class="max-w-xl mx-auto p-6 bg-white rounded shadow">
  <h2 class="text-2xl font-bold text-center mb-6">
    {{ isEditMode ? 'Editar' : 'Nuevo' }} Proyecto
  </h2>

  <form [formGroup]="projectForm" (ngSubmit)="save()">
    <!-- Nombre -->
    <div class="mb-4">
      <label for="name" class="block font-medium mb-1">Nombre</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="projectForm.get('name')?.invalid && projectForm.get('name')?.touched"
      />
      <div
        class="text-red-500 text-sm mt-1"
        *ngIf="projectForm.get('name')?.invalid && projectForm.get('name')?.touched"
      >
        El nombre es requerido
      </div>
    </div>

    <!-- Descripción -->
    <div class="mb-4">
      <label for="description" class="block font-medium mb-1">Descripción</label>
      <textarea
        id="description"
        formControlName="description"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="projectForm.get('description')?.invalid && projectForm.get('description')?.touched"
      ></textarea>
      <div
        class="text-red-500 text-sm mt-1"
        *ngIf="projectForm.get('description')?.invalid && projectForm.get('description')?.touched"
      >
        La descripción es requerida
      </div>
    </div>

    <!-- Ciudad -->
    <div class="mb-4">
      <label for="cityId" class="block font-medium mb-1">Ciudad</label>
      <select
        id="cityId"
        formControlName="cityId"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="projectForm.get('cityId')?.invalid && projectForm.get('cityId')?.touched"
      >
        <option value="">Seleccione una ciudad</option>
        <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
      </select>
      <div
        class="text-red-500 text-sm mt-1"
        *ngIf="projectForm.get('cityId')?.invalid && projectForm.get('cityId')?.touched"
      >
        La ciudad es requerida
      </div>
    </div>

    <!-- Material -->
    <div class="mb-4">
      <label for="material" class="block font-medium mb-1">Material</label>
      <select
        id="material"
        [(ngModel)]="selectedMaterialId"
        name="material"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="">Seleccione un material</option>
        <option *ngFor="let material of materials" [value]="material.id">{{ material.name }}</option>
      </select>
    </div>

    <!-- Cantidad -->
    <div class="mb-6">
      <label for="materialQuantity" class="block font-medium mb-1">Cantidad</label>
      <input
        type="number"
        id="materialQuantity"
        [(ngModel)]="materialQuantity"
        name="materialQuantity"
        min="0"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Botones -->
    <div class="flex justify-between">
      <button
        type="button"
        [routerLink]="['/projects']"
        class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="projectForm.invalid"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
