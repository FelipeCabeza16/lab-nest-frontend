<div class="container">
  <h2>Añadir material a proyecto</h2>

  <div *ngIf="errorMessage" class="mt-4 p-4 bg-red-100 text-red-700 border border-red-400 rounded">
    {{ errorMessage }}
  </div>

  <div class="form-group">
    <label for="material">Material</label>
    <select
      id="material"
      [(ngModel)]="selectedMaterialId"
      name="material"
      class="form-control"
    >
      <option value="">Seleccione un material</option>
      <option *ngFor="let material of materials" [value]="material.id">
        {{ material.name }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label for="quantity">Cantidad</label>
    <input
      type="number"
      id="quantity"
      [(ngModel)]="quantity"
      name="quantity"
      class="form-control"
      min="0"
    >
  </div>

  <div class="button-group">
    <button class="btn btn-primary" (click)="save()">Guardar</button>
    <button class="btn btn-secondary" [routerLink]="['/projects']">Cancelar</button>
  </div>
</div>
