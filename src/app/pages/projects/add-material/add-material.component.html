<div class="max-w-md mx-auto mt-8 p-6 border border-gray-300 rounded-lg bg-white shadow">
  <h2 class="text-xl font-semibold text-center text-gray-800 mb-6">
    Añadir material a proyecto
  </h2>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 text-red-700 border border-red-400 rounded">
    {{ errorMessage }}
  </div>

  <!-- Material Select -->
  <div class="mb-5">
    <label for="material" class="block text-sm font-semibold text-gray-700 mb-2">Material</label>
    <select
      id="material"
      [(ngModel)]="selectedMaterialId"
      name="material"
      class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      <option value="">Seleccione un material</option>
      <option *ngFor="let material of materials" [value]="material.id">
        {{ material.name }}
      </option>
    </select>
  </div>

  <!-- Quantity Input -->
  <div class="mb-6">
    <label for="quantity" class="block text-sm font-semibold text-gray-700 mb-2">Cantidad</label>
    <input
      type="number"
      id="quantity"
      [(ngModel)]="quantity"
      name="quantity"
      min="0"
      class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <!-- Buttons -->
  <div class="flex justify-end gap-3">
    <button
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium"
      (click)="save()"
    >
      Guardar
    </button>
    <button
      class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded font-medium"
      [routerLink]="['/projects']"
    >
      Cancelar
    </button>
  </div>
</div>
